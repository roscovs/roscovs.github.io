  function toB64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  if (!LOCKED || !window.crypto || !crypto.subtle) { err.textContent = "This browser can't open the invoice tool."; btn.disabled = true; return; }

  function openWith(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCKED.iv) }, key, b64(LOCKED.data)).then(function (plain) {
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    });
  }
  function deriveKey(pin) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pin.normalize("NFC")), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(LOCKED.salt), iterations: LOCKED.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }

  // Stay unlocked for this browser tab only (cleared when the tab closes or "Lock" is tapped).
  var saved = null; try { saved = sessionStorage.getItem(SKEY); } catch (e) {}
  if (saved) {
    crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]).then(openWith).catch(function () { try { sessionStorage.removeItem(SKEY); } catch (e) {} });
  }

  var fails = 0;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pin = input.value.trim(); if (!pin) return;
    btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
    var key;
    deriveKey(pin).then(function (k) { key = k; return crypto.subtle.exportKey("raw", k); }).then(function (raw) {
      return openWith(key).then(function () { try { sessionStorage.setItem(SKEY, toB64(raw)); } catch (e) {} });
    }).catch(function () {
      fails += 1;
      var wait = Math.min(30, fails * 2);
      err.textContent = "Wrong PIN. Try again in " + wait + " seconds.";
      input.value = "";
      setTimeout(function () { btn.disabled = false; btn.textContent = "Unlock"; err.textContent = "Wrong PIN."; input.focus(); }, wait * 1000);
    });
  });
})();
</script>
</body>
</html>
