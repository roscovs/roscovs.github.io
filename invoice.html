  var SKEY = "rosco-inv-key";
  var form = document.getElementById("f"), input = document.getElementById("pin"), btn = document.getElementById("go"), err = document.getElementById("err");
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  if (!LOCKED || !window.crypto || !crypto.subtle) { err.textContent = "This browser can't open the invoice tool."; btn.disabled = true; return; }

  function openWith(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCKED.iv) }, key, b64(LOCKED.data)).then(function (plain) {
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    });
  }
  function deriveKey(pin) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pin.normalize("NFC")), "PBKDF2", false, ["deriveKey"]).then(function (base) {

    deriveKey(pin).then(function (k) { key = k; return crypto.subtle.exportKey("raw", k); }).then(function (raw) {
