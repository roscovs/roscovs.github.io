  if (saved) {
    crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]).then(openWith).catch(function () { try { sessionStorage.removeItem(SKEY); } catch (e) {} });
  }

  var fails = 0;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pin = input.value.trim(); if (!pin) return;
    btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
    var key;
    deriveKey(pin).then(function (k) { key = k; return crypto.subtle.exportKey("raw", k); }).then(function (raw) {
      return openWith(key).then(function () { try { sessionStorage.setItem(SKEY, toB64(raw)); } catch (e) {} });
    }).catch(function () {
      fails += 1;
      var wait = Math.min(30, fails * 2);
      err.textContent = "Wrong PIN. Try again in " + wait + " seconds.";
      input.value = "";
      setTimeout(function () { btn.disabled = false; btn.textContent = "Unlock"; err.textContent = "Wrong PIN."; input.focus(); }, wait * 1000);
    });
  });
})();
</script>
</body>
</html>
